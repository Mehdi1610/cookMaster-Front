<app-nav-tab (tabChange)="onTabChange($event)"></app-nav-tab>

<div class="px-10 sm:px-8 lg:px-16 py-6">
  
  <!-- pour eviter les problemes de placeHolder sur le filtre catégorie plus de destruction du composant -->
  <div [hidden]="currentTab() === 'create'">
    
    <app-filter-tool (filtersChange)="onFiltersChange($event)"></app-filter-tool>
    
    <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      @for (recipe of displayedRecipes(); track recipe.id) {
        <app-recipe-card
          [recipe]="recipe"
          [categoryName]="categoryName(recipe.categoryId)"
          [isFavorite]="favoriteIds().has(recipe.id)"
          (favoriteToggle)="onFavoriteToggle($event)"
          (cardClick)="onRecipeClick($event)">
        </app-recipe-card>
      }

      @if (displayedRecipes().length === 0) {
        <p class="col-span-full text-center text-gray-500 py-12">
          @if (currentTab() === 'my-recipe') {
            Aucune recette à afficher pour le moment.
          } @else {
            Aucune recette ajoutée aux favoris.
          }
        </p>
      }
    </div>

  </div>


  @if (currentTab() === 'create') {
    <app-create-recipe></app-create-recipe>
  }

</div>

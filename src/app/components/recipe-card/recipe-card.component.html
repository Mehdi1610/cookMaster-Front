<div 
    (click)="onCardClick($event)"
    class="bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow overflow-hidden cursor-pointer">

    <!-- Image + bouton favori -->
    <div class="relative">
        <img
            [src]="recipe.imageUrl"
            [alt]="recipe.title"
            class="w-full h-44 object-cover"
        />
        <button
            type="button"
            (click)="onToggleFavorite($event)"
            class="absolute top-3 right-3 w-8 h-8 flex items-center justify-center bg-white/90 rounded-lg shadow-sm hover:bg-white transition-colors"
            [attr.aria-label]="isFavorite ? 'Retirer des favoris' : 'Ajouter aux favoris'"
        >
            <i
                class="pi text-sm"
                [class.pi-heart-fill]="isFavorite"
                [class.text-orange-500]="isFavorite"
                [class.pi-heart]="!isFavorite"
                [class.text-gray-500]="!isFavorite"
            ></i>
        </button>
    </div>

    <!-- Contenu -->
    <div class="p-4 bg-orange-400">
        <h3 class="text-base font-semibold text-gray-800 mb-2">{{ recipe.title }}</h3>

        <div class="flex items-center justify-between text-sm text-gray-800 mb-2">
            <span class="flex items-center gap-1">
                <i class="pi pi-clock text-xs"></i>
                {{ recipe.preparationTime }} min
            </span>
            <span class="flex items-center gap-1">
                <i class="pi pi-bolt text-xs"></i>
                {{ difficultyLabels[recipe.difficulty] }}
            </span>
        </div>
        @if (categoryName) {
            <span class="inline-block text-xs font-medium text-gray-800 bg-gray-200 rounded-full px-3 py-1">
                {{ categoryName }}
            </span>
        }
    </div>
</div>

<nav class="w-full bg-white border-b border-gray-200 px-10 sm:px-8 lg:px-16">
    <ul class="flex items-center gap-8">
        @for (tab of tabs; track tab.id) {
            <li>
                <button
                    type="button"
                    (click)="selectTab(tab.id)"
                    class="relative py-4 text-sm font-medium transition-colors"
                    [class.text-orange-500]="activeTab() === tab.id"
                    [class.text-gray-600]="activeTab() !== tab.id"
                    [class.hover:text-orange-400]="activeTab() !== tab.id"
                >
                    {{ tab.label }}

                    @if (activeTab() === tab.id) {
                        <span class="absolute left-0 -bottom-px w-full h-0.5 bg-orange-500 rounded-full"></span>
                    }
                </button>
            </li>
        }
    </ul>
</nav>
